# One-click release: Actions -> Release -> Run workflow.
#
# Bumps the version (or keeps it with "none"), tests, builds and packages the
# app, and only if all of that succeeds: pushes a "Release vX.Y.Z" commit to
# main, creates the vX.Y.Z tag and publishes a GitHub Release with the zip.
# With "dry run" ticked nothing is pushed or published; the zip is attached
# to the run as an artifact instead.
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (none = release the version already in Cargo.toml)"
        type: choice
        options: [patch, minor, major, none]
        default: patch
      dry_run:
        description: "Dry run: build and package only, don't push or publish"
        type: boolean
        default: false

permissions:
  contents: write

# Two releases at once would race for the same version number.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Only release from main
        if: github.ref != 'refs/heads/main' && !inputs.dry_run
        run: throw "Releases are made from main (this run is on ${{ github.ref_name }}). Use dry run to test other branches."

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, to check the new one doesn't exist yet

      - name: Work out version
        id: version
        run: |
          $version = ./scripts/bump-version.ps1 -Bump ${{ inputs.bump }}
          $tag = "v$version"
          if (git tag --list $tag) { throw "Tag $tag already exists. Pick a bump that gives a new version." }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "Releasing $tag"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Update Cargo.lock for the new version
        if: inputs.bump != 'none'
        run: cargo update --workspace

      - name: Cache FFmpeg download
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ffmpeg-cache
          key: ffmpeg-${{ hashFiles('scripts/fetch-ffmpeg.ps1') }}

      - name: Fetch FFmpeg
        run: |
          # The script caches its zip in %TEMP%; point that at the cached dir.
          $env:TEMP = "${{ runner.temp }}/ffmpeg-cache"; $env:TMP = $env:TEMP
          New-Item -ItemType Directory -Force $env:TEMP | Out-Null
          ./scripts/fetch-ffmpeg.ps1

      - name: Test
        run: cargo test --workspace --locked

      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: ./scripts/package.ps1 -Version ${{ steps.version.outputs.tag }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: playerstv-${{ steps.version.outputs.tag }}-windows-x64
          path: |
            dist/*.zip
            dist/*.sha256

      - name: Commit version bump
        if: inputs.bump != 'none' && !inputs.dry_run
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "Release ${{ steps.version.outputs.tag }}"
          # Fails (and publishes nothing) if main moved on during the build.
          git push origin HEAD:main

      - name: Tag and publish release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          $zip = "dist/playerstv-$env:TAG-windows-x64.zip"
          $notes = @"
          ## Download

          1. Download **playerstv-$env:TAG-windows-x64.zip** below and unzip it anywhere.
          2. Run ``playerstv.exe`` - it lives in the system tray. Left-click the tray icon for the window.

          Needs Windows 10 2004+ / 11 and an NVIDIA GPU (NVENC). Windows SmartScreen may warn
          because the app isn't code-signed: **More info -> Run anyway**.

          SHA-256: ``$((Get-Content "$zip.sha256").Split(' ')[0])``
          "@
          # Creates the tag on the commit that was built (incl. the bump commit).
          gh release create $env:TAG $zip "$zip.sha256" `
            --target (git rev-parse HEAD) `
            --title "playerstv $env:TAG" `
            --notes $notes `
            --generate-notes
