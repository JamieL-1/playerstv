# Checks every push to main and every pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch/PR supersedes an older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, lint, test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # The window's frontend (ui/) is embedded in playerstv.exe, so it's
      # built before any Rust step compiles crates/ui.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Frontend (format, lint, test, build)
        working-directory: ui
        run: |
          npm ci
          npm run check
          npm test
          npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

  bench:
    name: Microbenchmarks
    # Shared runners are too noisy to fail a build on, so this only records
    # the numbers. The recorder comparison needs an NVIDIA GPU and runs
    # locally: see BENCHMARKS.md.
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Neither crate embeds the frontend, so it isn't built here.
      - name: cargo bench
        run: cargo bench -p playerstv-core -p playerstv-bench --benches --locked -- --warm-up-time 1 --measurement-time 3

      - uses: actions/upload-artifact@v7
        with:
          name: criterion
          path: target/criterion

  audit:
    name: Dependency audit
    # Only reads Cargo.lock, so the cheaper Linux runner is fine.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # Fails on dependencies with known security advisories (RustSec).
      - name: cargo audit
        run: cargo audit
