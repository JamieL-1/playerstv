# Weekly PRs to keep dependencies current; CI checks each one.
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    groups:
      # One PR for routine minor/patch bumps instead of one per crate.
      minor-and-patch:
        update-types: [minor, patch]

  # The window's frontend.
  - package-ecosystem: npm
    directory: "/ui"
    schedule:
      interval: weekly
    # Releases must be at least two weeks old (project rule).
    cooldown:
      default-days: 14
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
