[workspace]
resolver = "2"
members = ["crates/core", "crates/capture", "crates/common", "crates/app", "crates/ui"]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
regex = "1"
tracing = "0.1"
chrono = "0.4"
crossbeam-channel = "0.5"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Rules from .claude/skills (unsafe-checker, coding-guidelines). CI's
# `-D warnings` turns these into errors.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
missing_safety_doc = "warn"
unwrap_used = "warn"
