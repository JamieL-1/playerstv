[workspace]
resolver = "2"
members = ["crates/core", "crates/capture", "crates/common", "crates/app", "crates/ui"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
regex = "1"
tracing = "0.1"
chrono = "0.4"
crossbeam-channel = "0.5"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
