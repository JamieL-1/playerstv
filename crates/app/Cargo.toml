[package]
name = "playerstv"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow.workspace = true
chrono.workspace = true
crossbeam-channel.workspace = true
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "clipboard", "accesskit"] }
global-hotkey = "0.9.0"
notify = "8.2.0"
playerstv-capture = { path = "../capture" }
playerstv-core = { path = "../core" }
rfd = "0.17.2"
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0.154"
tauri-winrt-notification = "0.8.1"
tracing.workspace = true
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tray-icon = "0.26.1"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_Console", "Win32_System_JobObjects", "Win32_Security", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_System_IO"] }
winreg = "0.56.0"
