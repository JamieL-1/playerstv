[package]
name = "playerstv"
version.workspace = true
edition.workspace = true

[[bin]]
name = "playerstv"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
anyhow.workspace = true
serde.workspace = true
tracing.workspace = true
chrono.workspace = true
serde_json = "1.0.154"
playerstv-common = { path = "../common" }
playerstv-core = { path = "../core" }
playerstv-capture = { path = "../capture" }
playerstv-tray = { path = "../app" }
tauri = { version = "2.12.1", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.8.1"
tauri-plugin-opener = "2.7.0"
tauri-plugin-single-instance = "2.5.2"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
webview2-com = "0.39.1"
global-hotkey = "0.9.0"
notify = "8.2.0"

[features]
# Embed the built frontend (ui/dist) in the exe. On by default so a plain
# `cargo build` (CI, release) produces a working app; for live-reload dev
# against `vp dev`, build with `--no-default-features`.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# Embed vendor/ffmpeg/ffmpeg.exe (about 100 MB), unpacked on first run, so the
# release is a single exe. Release builds and scripts/package.ps1 use it.
bundle-ffmpeg = []
